name: Release

# Releases are cut from an existing signed tag: bump Cargo.toml's version, tag the commit
# `v<version>`, push the tag, then dispatch this workflow with the same version. It cross-checks the
# tag against Cargo.toml, builds binaries on native runners (no QEMU compiles), attaches them to a
# GitHub Release, and pushes a multi-arch image to GHCR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0 or 1.3.0-beta.0); tag v<version> must exist'
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl -> fully static Linux binaries: portable across distros and drop-in for the
          # alpine-based docker image.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            docker_arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            docker_arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}

      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$CARGO_V" != "${{ inputs.version }}" ]; then
            echo "Cargo.toml version ($CARGO_V) does not match release version (${{ inputs.version }})"
            exit 1
          fi

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          ARCHIVE="stacksup-v${{ inputs.version }}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$ARCHIVE" -C "target/${{ matrix.target }}/release" stacksup
          (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stacksup-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "${{ inputs.version }}" | grep -q "-"; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${{ inputs.version }}" dist/* \
            --verify-tag \
            --generate-notes \
            $PRERELEASE_FLAG

  publish-docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stacksup-*-linux-musl
          path: artifacts

      # Lay the static binaries out as dist/<TARGETARCH>/stacksup for the Dockerfile's per-arch
      # COPY. The image has no RUN steps, so the multi-platform build needs no QEMU emulation.
      - name: Stage binaries per arch
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf artifacts/stacksup-x86_64-unknown-linux-musl/*.tar.gz -C dist/amd64
          tar -xzf artifacts/stacksup-aarch64-unknown-linux-musl/*.tar.gz -C dist/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Tag/Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: true
