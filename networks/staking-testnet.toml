# Network definition: the Stacks staking testnet (PoX-5 / Bitcoin staking), a Stacks chain on the
# Hiro-hosted custom Bitcoin signet. Referenced from stacks.toml as `network = "staking-testnet"`.
#
# Mirrors the live follower configs (stx-labs/infrastructure stacks-seed/signet). Requires a
# stacks-core build with `burnchain.mode = "signet"` (4.0.4+).

name = "staking-testnet"
chain_id = 0x00000500
hiro_api_url = "https://api.staking-testnet.hiro.so"
hiro_archive_path = "staking-testnet"
hiro_archive_prefix = "signet"

[bitcoind]
allow_managed = false
chain = "signet"
rpc_port = 38332
p2p_port = 38333
default_host = "bitcoin.staking-testnet.hiro.so"
signet_challenge = "0014511787db620184f553cfa06bb2a6607497f09f4a"

[node]
burnchain_mode = "signet"
bootstrap_node = "025b2f33eedfa699fa375f115d0c32a36820dd351a3d7f670a18fc324bfd6d1f63@3.136.174.30:20444"
node_extra = '''
pox_5_sbtc_contract = "SN3R84XZYA63QS28932XQF3G1J8R9PC3W76P9CSQS.sbtc-token"
pox_5_sbtc_registry_contract = "SN3R84XZYA63QS28932XQF3G1J8R9PC3W76P9CSQS.sbtc-registry"
pox_5_bond_admin = "ST1V2ASRWGR81W7GBN1Z4W2JQKXJWCADPVZG30X45"
'''

